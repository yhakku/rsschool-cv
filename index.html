<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user=scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>rsschool-cv</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner container">
        <nav class="header__menu">
          <ul class="header__menu-list">
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">Contacts</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">About</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">Skills</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">Code Example</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">My projects</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">Education</a>
            </li>
            <li class="header__menu-item">
              <a class="header__menu-link" href="#">Lenguages</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="section" aria-labelledby="section-title">
        <div class="section__body container">
          <img
            class="section__image"
            src="/rsschool-cv/images/avatar.jpg"
            alt=""
            width="148"
            height="148"
            loading="lazy"
          />
          <h1 class="section__title" id="section-title">Kargin Yuri, Frontend Developer</h1>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer__inner container">
        <a class="footer__link github-link" href="https://github.com/yhakku" target="_blank"
          >GitHub</a
        >
        <span>
          <time class="footer__date h4" datetime="2025-01-01">2025</time>
        </span>
        <a
          class="footer__link rsschool-link"
          href="https://rs.school/courses/javascript-ru"
          target="_blank"
          >RS School</a
        >
      </div>
    </footer>
  </body>
</html>
